name: solar system testing actions idk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

env:
  MONGO_URI: 'mongodb://localhost:27017/superData'
  MONGO_USERNAME: 'tebo'
  MONGO_PASSWORD: 'password'

jobs:
  # -------------------------------------------------------------------
  # Job 1: Unit Testing (Uses local containerized MongoDB)
  # -------------------------------------------------------------------
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

  # -------------------------------------------------------------------
  # Job 2: Code Coverage
  # -------------------------------------------------------------------
  code-coverage:
    name: Code Coverage
    needs: unit-testing
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Generate Code Coverage
        run: npm run coverage || npm test

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  # -------------------------------------------------------------------
  # Job 3: Docker Build
  # -------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    needs: code-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Image
        run: docker build -t solar-system:latest .

      - name: Export Image to Archive
        run: docker save solar-system:latest -o solar-system.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-system-image
          path: solar-system.tar

  # -------------------------------------------------------------------
  # Job 4: In-Pipeline Container Deployment & Health Verification
  # -------------------------------------------------------------------
  deploy-in-pipeline:
    name: In-Runner Deployment Test
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: solar-system-image

      - name: Load Image into Local Docker Engine
        run: docker load -i solar-system.tar

      - name: Create Isolated Container Network
        run: docker network create solar-net

      - name: Spin up Database Container
        run: |
          docker run -d \
            --name mongo-db \
            --network solar-net \
            mongo:6.0

      - name: Deploy Application Container
        run: |
          docker run -d \
            --name solar-app \
            --network solar-net \
            -p 3000:3000 \
            -e MONGO_URI="mongodb://mongo-db:27017/superData" \
            -e MONGO_USERNAME="selenium" \
            -e MONGO_PASSWORD="s3cret" \
            solar-system:latest

      - name: Test Application Live Status
        run: |
          sleep 5
          docker logs solar-app
          curl --fail http://localhost:3000/live || curl --fail http://localhost:3000/