# =============================================================================
# Solar System — GitHub Actions CI/CD (student lab)
# =============================================================================
# Flow:  tests  →  build & push image  →  deploy app to Kubernetes
#
# NOT in this pipeline (cluster admin, one time):
#   make deploy-deps
#   → applies kubernetes/dependencies/ (namespace, secrets, MongoDB + seed)
#
# Repo settings required:
#   vars.DOCKERHUB_USERNAME   — Docker Hub username
#   secrets.DOCKERHUB_TOKEN   — Docker Hub access token
#   secrets.KUBECONFIG        — raw kubeconfig for the target cluster
# =============================================================================

name: Solar System CI/CD

# When this workflow runs
on:
  # Manual run from the Actions tab (useful for demos / re-deploys)
  workflow_dispatch:
  # Automatic run on every push to main
  push:
    branches:
      - main

# Shared env for all jobs (tests use MONGO_* against the Actions service container)
